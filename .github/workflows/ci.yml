name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: .build/Python-3.13.7
          key: cpython-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_python.sh') }}
      - run: cargo fmt --check
      - run: python3 scripts/generate_manifest.py --check
      - run: python3 scripts/verify_manifold.py
      - run: python3 scripts/verify_opensubdiv.py
      - run: ./scripts/build_python.sh
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
      - run: python3 -m unittest discover -s tests
