[package]
name = "hb"
version = "0.18.0"
edition = "2024"
license = "MIT"
build = "build.rs"
description = "Headless 3D modeling with a tested subset of Blender's Python API"
repository = "https://github.com/Abdubek/hb"

[[bin]]
name = "hb"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
sha2 = "0.10.9"
base64 = "0.22.1"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
flate2 = "1.1.9"
cc = "1.2.66"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
